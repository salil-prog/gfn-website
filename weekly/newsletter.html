<title>Clean Cooking Weekly | GFN Solutions</title>

<style>
:root{color-scheme:light;--green:#11C97E;--green-dark:#0fb571;--ink:#1a1a1a;--text:#222;--body:#444;--muted:#999;--line:#ececec;--wash:#f4f6f4;--foot:#1d201d}
html,body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;color:var(--text)}
[hidden]{display:none!important}
a{color:#333} a:hover{color:var(--green)}
.page{font-size:16px;line-height:1.55}
.wrap{width:min(1100px,92%);margin:auto}
header{position:sticky;top:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid var(--line)}
header .wrap{padding:16px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 20px}
header img{height:44px;width:auto;display:block}
header nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px}
.navlink{text-decoration:none;color:#333;font-size:14px;font-weight:500;letter-spacing:.02em;padding:6px 0;border-bottom:2px solid transparent}
.navlink:hover{color:var(--green);border-bottom-color:var(--green)}
.cta{text-decoration:none;color:#fff;background:var(--green);font-size:14px;font-weight:600;padding:9px 20px;border-radius:999px;border:0;cursor:pointer;font-family:inherit}
.cta:hover{background:var(--green-dark);color:#fff}
main{max-width:720px;margin:auto;padding:48px 0 64px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--green);margin:0 0 8px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,5vw,50px);line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin:0 0 6px}
.date{font-size:14px;color:var(--muted)}
.sections{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 8px;padding:14px;background:var(--wash);border-radius:8px}
.sections a{text-decoration:none;font-size:14px;font-weight:500;color:#333;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.sections a:hover{border-color:var(--green);color:var(--green)}
article h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,32px);color:var(--green);margin:44px 0 14px;scroll-margin-top:90px}
article p{margin:0 0 16px;color:var(--body);font-size:16.5px;line-height:1.7}
.archive{margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.archive h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,32px);color:var(--green);margin:0 0 16px}
.arch-list{display:grid;gap:10px}
.arch-item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:8px;padding:16px 20px;transition:border-color .15s,box-shadow .15s}
.arch-item:hover{border-color:var(--green);box-shadow:0 6px 20px rgba(17,201,126,0.10)}
.arch-item[aria-current="true"]{border-color:var(--green)}
.arch-num{font-weight:600;font-size:16px;color:var(--ink)}
.arch-date{font-size:14px;color:var(--muted)}
.gate{max-width:380px;margin:56px auto 0;padding:32px 28px;border:1px solid var(--line);border-radius:8px;display:grid;gap:16px}
.gate h1{font-size:clamp(28px,4vw,36px);margin:0}
.gate p{margin:0;color:var(--body);font-size:15px}
.gate label{display:grid;gap:6px;font-size:14px;font-weight:500;color:#333}
.gate input{font:inherit;font-size:15px;padding:11px 14px;border:1px solid #d9dcd9;border-radius:8px;background:#fff;color:var(--text)}
.gate input:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.gate .cta{padding:12px 20px;font-size:15px;justify-self:start}
.err{font-size:14px;color:#c0392b;min-height:1.3em}
footer{background:var(--foot)}
footer .wrap{padding:40px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 24px}
footer img{height:40px;width:auto;display:block}
footer small{font-size:13px;color:rgba(255,255,255,.55)}
footer a{text-decoration:none;font-size:14px;color:rgba(255,255,255,.75)} footer a:hover{color:var(--green)}
</style>
</head>

async function unlock(cred){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(cred),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  route();
}
function show(n){
  const secs=[...document.querySelectorAll(".issue")]; if(!secs.length) return;
  const t=secs.find(x=>x.dataset.issue===n)||secs[0];
  secs.forEach(x=>x.hidden=(x!==t));
  document.querySelectorAll(".arch-item").forEach(a=>a.setAttribute("aria-current",a.dataset.go===t.dataset.issue?"true":"false"));
}
function route(){
  const h=location.hash.slice(1);
  if(/^issue-\d+$/.test(h)){show(h.slice(6));window.scrollTo(0,0)}
  else if(h.startsWith("i")&&/^i\d+-/.test(h)){show(h.slice(1,3));const el=document.getElementById(h);if(el)el.scrollIntoView()}
  else show("");
}
window.addEventListener("hashchange",route);
document.getElementById("gate").addEventListener("submit",async e=>{
  e.preventDefault();
  const cred=document.getElementById("u").value.trim().toLowerCase()+":"+document.getElementById("p").value;
  try{await unlock(cred)}catch(x){document.getElementById("err").textContent="That username and password didn't match. Check both and try again."}
});
